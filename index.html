
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mss Kwong Library</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background-color: #ffd1e3;
  background-image: url("bg\ pink.jpg");
  background-size: cover;
  background-position: center bottom;
  background-repeat: no-repeat;
  background-attachment: fixed;
  font-family: 'Segoe UI', Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}

h1 {
  color: #f15d98;
  font-size: 34px;
  margin-bottom: 0;
  text-shadow: 0 2px 10px white;
}

p {
  color: #9a5a78;
  margin-top: 5px;
  font-weight: 600;
}

.container {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 20px;
  flex-wrap: wrap;
  max-width: 1100px;
  margin: 20px auto;
}

.card {
  flex: 1;
  min-width: 320px;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.30);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(233, 30, 99, 0.15);
}

.big-card {
  max-width: 550px;
}

#list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 10px;
}

input, select {
  width: 90%;
  padding: 12px 10px;
  margin: 8px 0;
  border: none;
  outline: none;
  background: rgba(255, 255, 255, 0.45);
  border-radius: 15px;
  font-size: 15px;
  color: #d63384;
  font-weight: 600;
}

input::placeholder {
  color: #e7549a;
}

input:focus, select:focus {
  background: rgba(255, 255, 255, 0.65);
  color: #c2185b;
}

select {
  appearance: none;
}

select option {
  color: #d63384;
  background: #ffe6f0;
}

button {
  background: #ff69b4;
  color: white;
  border: none;
  outline: none;
  padding: 12px;
  width: 95%;
  border-radius: 20px;
  font-size: 15px;
  cursor: pointer;
  margin-top: 10px;
  transition: 0.2s;
}

button:hover {
  background: #e91e63;
  transform: translateY(-2px);
}

.small-btn {
  width: auto;
  padding: 8px 12px;
  font-size: 13px;
  background: #ff8fb8;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}

.filter-btn {
  width: auto;
  padding: 6px 12px;
  font-size: 12px;
  background: white;
  color: #d63384;
  border: 1px solid #ffb1cd;
}

.filter-btn:hover {
  background: #ff69b4;
  color: white;
}

.book {
  background: rgba(255, 255, 255, 0.60);
  padding: 15px;
  border-radius: 18px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-wrap: anywhere;
}

.book b {
  color: #c2185b;
  font-size: 16px;
}

.book span {
  color: #7a4a60;
  font-size: 13px;
}

.delete {
  background: rgba(255, 255, 255, 0.6);
  color: #e91e63;
  border: none;
  width: auto;
  align-self: flex-start;
  padding: 6px 12px;
  border-radius: 15px;
  font-size: 13px;
  margin-top: 8px;
}

.delete:hover {
  background: #e91e63;
  color: white;
}

.empty {
  grid-column: 1 / -1;
  color: #9a5a78;
  padding: 20px;
}

@media (max-width: 700px) {
  #list {
    grid-template-columns: 1fr;
  }

  .container {
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 100%;
    min-width: 0;
  }

  h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<h1>Miss Kwong Library</h1>
<p>Try to track my books</p>

<div class="container">

  
  <div class="card">
    <h3>Add a Book</h3>

    <input type="text" id="title" placeholder="Book title">

    <input type="text" id="author" placeholder="Author">

    <select id="status">
      <option>Want to Read</option>
      <option>Currently Reading</option>
      <option>Finished</option>
    </select>

    <button onclick="addBook()">+ Add Book</button>

    <br><br>

    <button class="small-btn" onclick="loadSampleBooks()">
      Load Sample Books
    </button>

    <button class="small-btn" onclick="clearAll()">
      Clear All
    </button>
  </div>


  <div class="card big-card">
    <h3>My Books</h3>

    <input
      type="text"
      id="search"
      placeholder="Search books..."
      oninput="showBooks()"
    >

    <div class="filters">
      <button class="filter-btn" onclick="setFilter('All')">All</button>

      <button class="filter-btn" onclick="setFilter('Want to Read')">
        Want to Read
      </button>

      <button class="filter-btn" onclick="setFilter('Currently Reading')">
        Currently Reading
      </button>

      <button class="filter-btn" onclick="setFilter('Finished')">
        Finished
      </button>
    </div>

    <p id="count"></p>

    <div id="list"></div>
  </div>

</div>

<script>

let books = JSON.parse(localStorage.getItem("mss_books")) || [
  {
    title: "Harry Potter",
    author: "J.K. Rowling",
    status: "Finished"
  },
  {
    title: "Atomic Habits",
    author: "James Clear",
    status: "Currently Reading"
  }
];

let currentFilter = "All";


function saveBooks() {
  localStorage.setItem("mss_books", JSON.stringify(books));
}


function setFilter(filter) {
  currentFilter = filter;
  showBooks();
}

function showBooks() {
  let searchText = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");

  list.innerHTML = "";

  let shown = 0;

  books.forEach(function(book, index) {

    if (
      currentFilter !== "All" &&
      book.status !== currentFilter
    ) {
      return;
    }

    if (
      !book.title.toLowerCase().includes(searchText) &&
      !book.author.toLowerCase().includes(searchText)
    ) {
      return;
    }

    shown++;

    let bookCard = document.createElement("div");
    bookCard.className = "book";

    let title = document.createElement("b");
    title.textContent = book.title;

    let details = document.createElement("span");
    details.textContent = book.author + " - " + book.status;

    let deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete";

    deleteButton.onclick = function() {
      deleteBook(index);
    };

    bookCard.appendChild(title);
    bookCard.appendChild(details);
    bookCard.appendChild(deleteButton);

    list.appendChild(bookCard);

  });

  if (shown === 0) {
    let empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No books found ♡";
    list.appendChild(empty);
  }

  document.getElementById("count").textContent =
    "Total: " + books.length +
    " books | Showing: " + shown;
}


function addBook() {

  let title = document.getElementById("title").value.trim();
  let author = document.getElementById("author").value.trim();
  let status = document.getElementById("status").value;

  if (!title || !author) {
    alert("Please fill in the book title and author!");
    return;
  }

  books.push({
    title: title,
    author: author,
    status: status
  });

  saveBooks();
  showBooks();

  document.getElementById("title").value = "";
  document.getElementById("author").value = "";
}


function deleteBook(index) {

  if (confirm("Are you sure you want to delete this book?")) {
    books.splice(index, 1);
    saveBooks();
    showBooks();
  }

}


function clearAll() {

  if (confirm("Are you sure you want to delete all books?")) {
    books = [];
    saveBooks();
    showBooks();
  }

}


function loadSampleBooks() {

  let samples = [
    {
      title: "The Little Prince",
      author: "Antoine de Saint-Exupery",
      status: "Want to Read"
    },
    {
      title: "Pride and Prejudice",
      author: "Jane Austen",
      status: "Want to Read"
    },
    {
      title: "To Kill a Mockingbird",
      author: "Harper Lee",
      status: "Finished"
    }
  ];

  books = books.concat(samples);

  saveBooks();
  showBooks();

}


showBooks();

</script>

</body>
</html>
